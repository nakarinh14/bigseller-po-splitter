<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PO Splitter</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg: #f6f6f3; --surface: #fff; --text: #1d1d1b; --muted: #6b6b66;
    --line: #e2e2dc; --accent: #2f6b4f; --accent-text: #fff; --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --surface: #1f1f1d; --text: #ecece8; --muted: #9a9a93;
      --line: #33332f; --accent: #6fbf95; --accent-text: #0f1a14; --err: #f2867e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  #drop { border: 2px dashed var(--line); border-radius: 10px; background: var(--surface);
    padding: 36px 16px; text-align: center; cursor: pointer; transition: border-color .15s; }
  #drop.over, #drop:hover { border-color: var(--accent); }
  #drop strong { display: block; font-size: 16px; }
  #drop span { color: var(--muted); font-size: 13px; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 20px 0 12px; }
  .bar .grow { flex: 1; color: var(--muted); font-size: 13px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--text);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.skus { color: var(--muted); font-size: 12px; word-break: break-all; }
  td.actions { white-space: nowrap; }
  td.actions button + button { margin-left: 6px; }
  #status { margin-top: 12px; font-size: 13px; color: var(--muted); min-height: 1.5em; }
  #status.err { color: var(--err); }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>Purchase Suggestion Splitter</h1>
  <p class="sub">Splits a BigSeller Purchase Suggestion export into one Excel file per product (SKU without its last two parts: model and color), with product images embedded.</p>

  <div id="drop">
    <strong>Drop the .xlsx export here</strong>
    <span>or click to choose a file</span>
    <input id="file" type="file" accept=".xlsx,.xls" hidden>
  </div>

  <div id="result" class="hidden">
    <div class="bar">
      <div class="grow" id="summary"></div>
      <button class="primary" id="dlAll">Download all (.zip)</button>
    </div>
    <table>
      <thead><tr><th>Prefix</th><th class="num">SKUs</th><th class="num">Proposed</th><th>SKU names</th><th></th></tr></thead>
      <tbody id="groups"></tbody>
    </table>
  </div>
  <div id="status"></div>
</main>

<script>
const COLUMNS = [
  // Image goes in column A: previewers that place pictures by absolute offset (LINE, Quick Look)
  // measure column widths differently from Excel, so only the first column lines up everywhere.
  // `header` is the export column read; `label` is the summary's heading, English over Simplified
  // Chinese for the readers in the LINE group, whatever language BigSeller is in.
  { header: 'Image Link', label: 'Image\n图片', width: 16, image: true },
  { header: 'SKU Name', label: 'SKU Name\nSKU名称', width: 28 },
  { header: 'Title', label: 'Title\n商品标题', width: 50 },
  { header: 'Proposed Qty', label: 'Proposed Qty\n建议采购量', width: 13, num: true },
  { header: 'Available', label: 'Available\n可用库存', width: 11, num: true },
  { header: 'On The Way', label: 'On The Way\n在途库存', width: 12, num: true },
  { header: 'Forecasted Daily Sales', label: 'Forecasted Daily Sales\n预测日销量', width: 14, num: true },
];
// BigSeller exports in its UI language. Thai headers are mapped to the English names used throughout.
const TH_HEADERS = {
  'ชื่อSKU': 'SKU Name',
  'หัวข้อ': 'Title',
  'จำนวนที่แนะนำ': 'Proposed Qty',
  'สต็อกพร้อมขาย': 'Available',
  'ระหว่างทาง': 'On The Way',
  'การคาดการณ์ยอดขายรายวัน': 'Forecasted Daily Sales',
  'ลิงก์รูปภาพ': 'Image Link',
  'ชื่อคลังสินค้า': 'Warehouse',
};
const EN_TO_TH = Object.fromEntries(Object.entries(TH_HEADERS).map(([th, en]) => [en, th]));
const IMG_PX = 100;          // rendered image size in Excel
const ROW_HEIGHT_PT = 80;    // ~ IMG_PX + padding, in points

let rows = [];               // parsed rows: { 'SKU Name': ..., ... }
let sourceName = 'purchase-suggestion';
let bigsellerLang = 'en';     // language of the export, reused for the purchase plan import headers
let loadDate = '';            // YYYYMMDD of the upload, part of each group's plan key
const imageCache = new Map(); // url -> Promise<base64 jpeg | null>

const $ = id => document.getElementById(id);
const setStatus = (msg, isErr) => { $('status').textContent = msg; $('status').className = isErr ? 'err' : ''; };

// ---------- input ----------
const drop = $('drop');
drop.onclick = () => $('file').click();
$('file').onchange = e => e.target.files[0] && loadFile(e.target.files[0]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); e.dataTransfer.files[0] && loadFile(e.dataTransfer.files[0]); };

async function loadFile(file) {
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    let data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
    if (!data.length) throw new Error('The sheet has no data rows.');
    const lang = 'ชื่อSKU' in data[0] ? 'th' : 'en';
    if (lang === 'th') data = data.map(r => Object.fromEntries(Object.entries(r).map(([k, v]) => [TH_HEADERS[k] ?? k, v])));
    const missing = COLUMNS.map(c => c.header).filter(h => !(h in data[0]));
    if (missing.length) throw new Error('Missing columns: ' + missing.map(h => lang === 'th' ? EN_TO_TH[h] : h).join(', '));
    bigsellerLang = lang;
    rows = data.filter(r => String(r['SKU Name']).trim());
    sourceName = file.name.replace(/\.[^.]+$/, '');
    const d = new Date();
    loadDate = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    imageCache.clear();
    setStatus('');
    render();
  } catch (err) {
    $('result').classList.add('hidden');
    setStatus('Could not read file: ' + err.message, true);
  }
}

// ---------- grouping ----------
// SKUs look like <product>-<model>-<color>, e.g. MB-CR-2681-KK. Drop the last two segments,
// then trim leftover model fragments for models that contain a dash (IP17-18PM, IP-17-18PM, FO-8W).
const MODEL_FRAGMENT = /^(IP|FO|FL)?\d*$/i;
const prefixOf = sku => {
  const parts = String(sku).trim().split('-').filter(Boolean);
  let keep = parts.slice(0, -2);
  while (keep.length > 1 && MODEL_FRAGMENT.test(keep[keep.length - 1])) keep.pop();
  if (!keep.length) keep = parts.slice(0, 1);
  return keep.join('-') + '-';
};
const toNum = v => {
  const n = parseFloat(String(v).replace(/,/g, ''));
  return Number.isFinite(n) ? n : null;
};

function groupRows() {
  const groups = new Map();
  for (const r of rows) {
    if (!toNum(r['Proposed Qty'])) continue; // nothing to order
    const p = prefixOf(r['SKU Name']);
    if (!groups.has(p)) groups.set(p, []);
    groups.get(p).push(r);
  }
  for (const list of groups.values()) list.sort((a, b) => String(a['SKU Name']).localeCompare(String(b['SKU Name'])));
  return [...groups.entries()].sort((a, b) => proposedOf(b[1]) - proposedOf(a[1]) || a[0].localeCompare(b[0]));
}
const proposedOf = list => list.reduce((n, r) => n + (toNum(r['Proposed Qty']) || 0), 0);

function render() {
  const groups = groupRows();
  const total = groups.reduce((n, [, l]) => n + l.length, 0);
  const skipped = rows.length - total;
  $('summary').textContent = `${total} SKUs → ${groups.length} groups` + (skipped ? ` (${skipped} with Proposed Qty 0 skipped)` : '')
    + ` · BigSeller in ${bigsellerLang === 'th' ? 'Thai' : 'English'}`;
  const tbody = $('groups');
  tbody.innerHTML = '';
  for (const [prefix, list] of groups) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><strong></strong></td><td class="num">${list.length}</td><td class="num">${proposedOf(list)}</td><td class="skus"></td><td class="actions"><button class="summary">Summary</button><button class="plan">Purchase plan</button></td>`;
    tr.querySelector('strong').textContent = prefix;
    tr.querySelector('.skus').textContent = list.map(r => r['SKU Name']).join(', ');
    tr.querySelector('.summary').onclick = e => run(e.target, async () => {
      const buf = await buildWorkbook(prefix, list, s => setStatus(`${prefix} ${s}`));
      saveBlob(new Blob([buf]), fileNameFor(prefix));
    });
    tr.querySelector('.plan').onclick = e => run(e.target, async () => {
      saveBlob(new Blob([await buildPlanWorkbook(prefix, list, bigsellerLang)]), planFileName(prefix));
    });
    tbody.appendChild(tr);
  }
  $('result').classList.remove('hidden');
}

// File names safe on Windows and macOS: no whitespace, no characters Windows forbids,
// no trailing dots, and never a reserved device name (CON, NUL, COM1, ...).
const safeName = s => {
  let n = String(s).normalize('NFC')
    .replace(/[\s\\/:*?"<>|\x00-\x1f]+/g, '_')
    .replace(/_+/g, '_')
    .replace(/^[._-]+|[._-]+$/g, '');
  if (/^(con|prn|aux|nul|com\d|lpt\d)$/i.test(n)) n += '_';
  return n || 'file';
};
// Plan key = group + upload date, e.g. MB-20261024. It goes in the purchase plan's notes and in the
// summary's file and sheet name, so a summary confirmed in LINE can be matched to its BigSeller draft.
const planKey = prefix => prefix.replace(/-$/, '') + '-' + loadDate;
const fileNameFor = prefix => safeName(planKey(prefix)) + '.xlsx';
const planFileName = prefix => safeName(planKey(prefix)) + '_purchase_plan.xlsx';

// ---------- images ----------
// Fetch and re-encode to JPEG via canvas so Excel always gets a supported format (BigSeller may serve webp).
function loadImage(url) {
  if (!url || !/^https?:/i.test(url)) return Promise.resolve(null);
  if (!imageCache.has(url)) {
    imageCache.set(url, (async () => {
      try {
        const res = await fetch(url);
        if (!res.ok) return null;
        const bmp = await createImageBitmap(await res.blob());
        const scale = Math.min(1, 300 / Math.max(bmp.width, bmp.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(bmp.width * scale);
        canvas.height = Math.round(bmp.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL('image/jpeg', 0.85);
      } catch { return null; }
    })());
  }
  return imageCache.get(url);
}

async function mapLimit(items, limit, fn) {
  const out = new Array(items.length);
  let next = 0;
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, async () => {
    while (next < items.length) { const i = next++; out[i] = await fn(items[i], i); }
  }));
  return out;
}

// ---------- workbook ----------
async function buildWorkbook(prefix, list, progress) {
  let done = 0;
  const images = await mapLimit(list, 8, async r => {
    const img = await loadImage(String(r['Image Link']).trim());
    progress(`images ${++done}/${list.length}`);
    return img;
  });

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet(planKey(prefix).replace(/[\\/?*:[\]]/g, '_').slice(0, 31), { views: [{ state: 'frozen', ySplit: 1 }] });
  ws.columns = COLUMNS.map(c => ({ header: c.label, key: c.header, width: c.width }));
  const head = ws.getRow(1);
  head.font = { bold: true };
  head.alignment = { vertical: 'middle', wrapText: true };
  head.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEFEFEA' } };
  head.height = 48;

  const imageIds = new Map(); // image data -> workbook image id, so identical photos are stored once
  const frames = [];          // absolute EMU position/size of each picture, in insertion order
  const imgCol = COLUMNS.findIndex(c => c.image);
  const colPx = c => c.width * 7 + 5;
  const imgColX = COLUMNS.slice(0, imgCol).reduce((n, c) => n + colPx(c), 0);
  const cellW = colPx(COLUMNS[imgCol]), cellH = ROW_HEIGHT_PT * 4 / 3;
  const padX = Math.round((cellW - IMG_PX) / 2), padY = Math.round((cellH - IMG_PX) / 2);
  list.forEach((r, i) => {
    const values = {};
    for (const c of COLUMNS) {
      if (c.image) continue;
      values[c.header] = c.num ? (toNum(r[c.header]) ?? r[c.header]) : r[c.header];
    }
    const row = ws.addRow(values);
    row.height = ROW_HEIGHT_PT;
    row.alignment = { vertical: 'middle', wrapText: true };

    const url = String(r['Image Link']).trim();
    if (images[i]) {
      if (!imageIds.has(images[i])) imageIds.set(images[i], wb.addImage({ base64: images[i], extension: 'jpeg' }));
      // Both corners anchored inside the cell, offsets in native EMU (ExcelJS's fractional
      // col/row offsets use their own scale and come out tiny).
      const at = d => ({ nativeCol: imgCol, nativeColOff: (padX + d) * EMU_PX, nativeRow: row.number - 1, nativeRowOff: (padY + d) * EMU_PX });
      ws.addImage(imageIds.get(images[i]), { tl: at(0), br: at(IMG_PX), editAs: 'twoCell' });
      frames.push({
        x: (imgColX + padX) * EMU_PX,
        y: Math.round((head.height + (row.number - 2) * ROW_HEIGHT_PT) * EMU_PT + padY * EMU_PX),
        size: IMG_PX * EMU_PX,
      });
    } else if (url) {
      row.getCell(imgCol + 1).value = { text: 'Image unavailable / 图片无法显示', hyperlink: url };
    }
  });
  return fixPictureFrames(await wb.xlsx.writeBuffer(), frames);
}

// ExcelJS writes every picture with a 0x0 shape frame (<a:off x="0" y="0"/><a:ext cx="0" cy="0"/>).
// Excel ignores it and uses the cell anchors, but simpler viewers (e.g. LINE's file preview) draw
// the picture at that size, i.e. invisibly. Write the real position and size instead.
const EMU_PX = 9525, EMU_PT = 12700;
async function fixPictureFrames(buf, frames) {
  if (!frames.length) return buf;
  const zip = await JSZip.loadAsync(buf);
  const path = 'xl/drawings/drawing1.xml';
  let i = 0;
  const xml = (await zip.file(path).async('string')).replace(
    /<a:off x="0" y="0"\/><a:ext cx="0" cy="0"\/>/g,
    m => { const f = frames[i++]; return f ? `<a:off x="${f.x}" y="${f.y}"/><a:ext cx="${f.size}" cy="${f.size}"/>` : m; },
  );
  zip.file(path, xml);
  return zip.generateAsync({ type: 'arraybuffer' });
}

// BigSeller "Import purchase plan" template: rows sharing a Temporary ID become one plan,
// so each group's file holds a single plan with ID 1. BigSeller expects the headers in the
// language its UI is set to; the Thai ones are copied verbatim from its template, leading spaces included.
const PLAN_COLUMNS = [
  { key: 'id', header: { en: '*Temporary ID (Required)', th: '*หมายเลขชั่วคราว(Required)' }, width: 25, required: true },
  { key: 'sku', header: { en: '*SKU Name (Required)', th: '*เลข SKU(Required)' }, width: 30, required: true },
  { key: 'qty', header: { en: '*Planned Purchase Quantity (Required)', th: '*จำนวนแผนการสั่งซื้อ(Required)' }, width: 38, required: true },
  { key: 'supplier', header: { en: 'Supplier', th: ' Supplier' }, width: 25 },
  { key: 'warehouse', header: { en: 'Receiving Warehouse', th: 'คลังสินค้าที่รับ' }, width: 25 },
  { key: 'notes', header: { en: 'Purchase Plan Notes', th: 'หมายเหตุการวางแผนสั่งซื้อ' }, width: 28 },
  { key: 'date', header: { en: 'Expected Delivery Date', th: ' วันที่คาดจะมาถึง' }, width: 25 },
];

const blankDash = v => { const s = String(v ?? '').trim(); return s === '--' ? '' : s; };

function buildPlanWorkbook(prefix, list, lang) {
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('sheet1');
  ws.columns = PLAN_COLUMNS.map(c => ({ key: c.key, header: c.header[lang], width: c.width }));
  ws.getRow(1).height = 30;
  PLAN_COLUMNS.forEach((c, i) => {
    ws.getCell(1, i + 1).font = { bold: true, color: { argb: c.required ? 'FFFF0000' : 'FF000000' } };
  });
  for (const r of list) {
    ws.addRow({
      id: 1,
      sku: String(r['SKU Name']).trim(),
      qty: Math.ceil(toNum(r['Proposed Qty'])), // template accepts positive integers only
      supplier: blankDash(r['Supplier']),
      warehouse: blankDash(r['Warehouse']),
      notes: planKey(prefix),
    });
  }
  return wb.xlsx.writeBuffer();
}

// ---------- download ----------
function saveBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

async function run(btn, task) {
  const buttons = document.querySelectorAll('button');
  buttons.forEach(b => b.disabled = true);
  try { await task(); setStatus('Done.'); }
  catch (err) { setStatus('Failed: ' + err.message, true); }
  finally { buttons.forEach(b => b.disabled = false); }
}

$('dlAll').onclick = e => run(e.target, async () => {
  const groups = groupRows();
  const zip = new JSZip();
  for (const [i, [prefix, list]] of groups.entries()) {
    const buf = await buildWorkbook(prefix, list, s => setStatus(`File ${i + 1}/${groups.length} (${prefix}) ${s}`));
    zip.file('Summary/' + fileNameFor(prefix), buf);
    zip.file('Purchase_plan/' + planFileName(prefix), await buildPlanWorkbook(prefix, list, bigsellerLang));
  }
  setStatus('Zipping…');
  saveBlob(await zip.generateAsync({ type: 'blob' }), safeName(sourceName) + '_split.zip');
});
</script>
</body>
</html>
